<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entraînement allemand</title>
<style>
:root{--teal:#4aadb0;--bg:#eee;--red:#d91e18;--green:#6aa51d;--txt:#333;--muted:#777}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--txt)}
header{background:var(--teal);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header button{background:rgba(255,255,255,.15);border:1px solid #fff;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;margin-left:6px}
main{max-width:720px;margin:0 auto;padding:16px}
.panel{background:var(--bg);border-radius:8px;padding:18px;margin-bottom:16px}
.panel h2{font-size:17px;margin:4px 0 10px}
.panel h3{font-size:15px;margin:14px 0 6px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:12px}
.bar{height:8px;background:#d5ecec;border-radius:4px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--teal);transition:width .3s}
.card{background:var(--bg);border-radius:8px;min-height:460px;display:flex;flex-direction:column;align-items:center;padding:28px 20px}
.word{font-size:28px;margin-top:24px;text-align:center}
.pos{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.answer{font-size:26px;text-align:center;margin-top:8px}
.extra{font-size:15px;color:#555;text-align:center;margin-top:12px;max-width:520px}
.spk{background:none;border:none;font-size:20px;cursor:pointer;margin-top:10px}
.actions{margin-top:auto;text-align:center;width:100%;padding-top:24px}
.btn{border:none;border-radius:50%;width:64px;height:64px;font-size:28px;color:#fff;cursor:pointer;margin:0 18px}
.btn.reveal{background:var(--teal)}
.btn.no{background:var(--red)}
.btn.yes{background:var(--green)}
.q{font-weight:bold;font-size:14px;margin-bottom:10px}
.primary,button.std{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:14px}
.danger{background:var(--red);color:#fff;border:none;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:14px}
label{display:block;margin:8px 0;font-size:14px}
input,select{display:block;width:100%;max-width:420px;padding:7px;margin-top:4px;font-size:14px}
.btnlike{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:14px}
ul{margin:4px 0;padding-left:20px;font-size:14px}
li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.muted{color:var(--muted);font-size:13px}
details{margin-top:10px}
summary{cursor:pointer;font-size:14px}
p{margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>Entraînement allemand</h1>
  <nav><button onclick="show('home')">Accueil</button><button onclick="show('bilan')">Bilan</button></nav>
</header>
<main>
<section id="home">
  <div class="panel">
    <p>Série de 25 mots tirés au hasard. Les mots que tu oublies reviennent plus souvent.</p>
    <label>Mode
      <select id="mode">
        <option value="vocab">Vocabulaire</option>
        <option value="verb">Conjugaison</option>
        <option value="both">Les deux</option>
      </select>
    </label>
    <p><button class="primary" onclick="startSeries()">Démarrer une série</button></p>
  </div>
</section>

<section id="quiz" hidden>
  <div class="prog"><div class="bar"><div id="barFill" style="width:0"></div></div><span id="count"></span></div>
  <div class="card">
    <div id="front"></div>
    <div id="back" hidden></div>
    <div class="actions" id="actR"><button class="btn reveal" onclick="reveal()" title="Révéler (Espace)">⟳</button></div>
    <div class="actions" id="actV" hidden>
      <div class="q">Connaissez-vous le mot ?</div>
      <button class="btn no" onclick="answer(false)" title="Non (N / ←)">✖</button>
      <button class="btn yes" onclick="answer(true)" title="Oui (Y / →)">✔</button>
    </div>
  </div>
</section>

<section id="end" hidden><div class="panel" id="endBody"></div></section>

<section id="bilan" hidden>
  <div class="panel">
    <h2>Synchronisation</h2>
    <p><button class="primary" onclick="sync()">Synchroniser</button> <span id="syncMsg" class="muted"></span></p>
    <details>
      <summary>Réglages de synchronisation</summary>
      <label>Adresse du script (se termine par /exec)<input id="cfgUrl" type="url"></label>
      <label>Clé secrète<input id="cfgKey" type="text"></label>
      <p><button class="std" onclick="saveCfg()">Enregistrer</button></p>
    </details>
  </div>
  <div class="panel"><h2>Résumé</h2><div id="summary"></div></div>
  <div class="panel">
    <h2>Mots à revoir</h2><div id="weak"></div>
    <h2>Mots bien connus</h2><div id="known"></div>
  </div>
  <div class="panel"><h2>Historique des séries</h2><div id="history"></div></div>
  <div class="panel">
    <h2>Sauvegarde locale</h2>
    <p><button class="std" onclick="exportJson()">Exporter (JSON)</button>
    <label class="btnlike">Importer<input type="file" accept=".json" onchange="importJson(event)" hidden></label></p>
    <p><button class="danger" onclick="resetAll()">Effacer l'historique de cet appareil</button></p>
  </div>
</section>
</main>

const LS = 'de_sessions', CFG = 'de_cfg';
let sessions = JSON.parse(localStorage.getItem(LS) || '[]');
let cfg = JSON.parse(localStorage.getItem(CFG) || '{}');
const ALL = [
  ...DATA.vocab.map(v => Object.assign({kind: 'vocab'}, v)),
  ...DATA.verbs.map(v => Object.assign({kind: 'verb'}, v))
];
const byId = Object.fromEntries(ALL.map(x => [x.id, x]));
let items = [], idx = 0, results = [], mode = 'vocab';

function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){ localStorage.setItem(LS, JSON.stringify(sessions)); }
function label(it){
  return it.kind === 'vocab' ? it.de + ' — ' + it.fr
    : it.lemma + ' · ' + it.pron + ' · ' + it.tenseDe + ' → ' + it.form;
}
function show(id){
  ['home','quiz','end','bilan'].forEach(s => document.getElementById(s).hidden = (s !== id));
  if (id === 'bilan') { renderBilan(); fillCfg(); }
  window.scrollTo(0, 0);
}

function stats(){
  const m = {};
  for (const s of sessions) for (const r of s.results) {
    const x = m[r.id] || (m[r.id] = {seen: 0, ok: 0});
    x.seen++; if (r.ok) x.ok++;
  }
  return m;
}

function pickSeries(pool){
  const st = stats();
  let arr = pool.map(it => {
    const x = st[it.id];
    return {it, w: (x && x.seen) ? 1 + 4 * (1 - x.ok / x.seen) : 2};
  });
  const out = [];
  while (out.length < 25 && arr.length) {
    const tot = arr.reduce((a, b) => a + b.w, 0);
    let r = Math.random() * tot, k = 0;
    for (; k < arr.length - 1; k++) { r -= arr[k].w; if (r <= 0) break; }
    out.push(arr[k].it);
    arr.splice(k, 1);
  }
  return out;
}

function startSeries(){
  mode = document.getElementById('mode').value;
  const pool = ALL.filter(x => mode === 'both' || x.kind === mode);
  items = pickSeries(pool); idx = 0; results = [];
  show('quiz'); render();
}

function render(){
  const it = items[idx];
  document.getElementById('count').textContent = (idx + 1) + ' / ' + items.length;
  document.getElementById('barFill').style.width = (idx / items.length * 100) + '%';
  let front;
  if (it.kind === 'vocab') front = '<div class="word">' + esc(it.de) + '</div><div class="pos">' + esc(it.pos) + '</div>';
  else front = '<div class="word">' + esc(it.lemma) + '</div><div class="pos">' + esc(it.pron) + ' · ' + esc(it.tenseDe) + '</div>';
  front += '<button class="spk" onclick="speakCur()" title="Écouter">🔊</button>';
  document.getElementById('front').innerHTML = front;
  document.getElementById('back').hidden = true;
  document.getElementById('back').innerHTML = '';
  document.getElementById('actR').hidden = false;
  document.getElementById('actV').hidden = true;
}

function reveal(){
  const it = items[idx];
  let back;
  if (it.kind === 'vocab') {
    back = '<div class="answer">' + esc(it.fr) + '</div>' + (it.mehr ? '<div class="extra">' + esc(it.mehr) + '</div>' : '');
  } else {
    back = '<div class="answer">' + esc(it.form) + '</div><div class="extra">' + esc(it.lemmaFr) + ' · ' + esc(it.tenseFr) + '</div>';
  }
  document.getElementById('back').innerHTML = back;
  document.getElementById('back').hidden = false;
  document.getElementById('actR').hidden = true;
  document.getElementById('actV').hidden = false;
}

function answer(ok){
  results.push({id: items[idx].id, ok});
  idx++;
  if (idx >= items.length) finish(); else render();
}

function finish(){
  const total = items.length, score = results.filter(r => r.ok).length;
  sessions.push({
    id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: new Date().toISOString(), mode, score, total, results
  });
  save();
  const good = results.filter(r => r.ok), bad = results.filter(r => !r.ok);
  const li = arr => arr.length
    ? '<ul>' + arr.map(r => '<li>' + esc(label(byId[r.id])) + '</li>').join('') + '</ul>'
    : '<p class="muted">Aucun</p>';
  document.getElementById('endBody').innerHTML =
    '<h2>Score : ' + score + ' / ' + total + ' (' + Math.round(score / total * 100) + ' %)</h2>' +
    '<h3>Oubliés</h3>' + li(bad) + '<h3>Réussis</h3>' + li(good) +
    '<p><button class="primary" onclick="show(\'home\')">Accueil</button> ' +
    '<button class="primary" onclick="startSeries()">Nouvelle série</button></p>';
  show('end');
}

function renderBilan(){
  const st = stats();
  const rows = Object.entries(st).map(([id, x]) => ({it: byId[id], seen: x.seen, ok: x.ok, r: x.ok / x.seen})).filter(o => o.it);
  const total = sessions.reduce((a, s) => a + s.total, 0), score = sessions.reduce((a, s) => a + s.score, 0);
  document.getElementById('summary').innerHTML =
    '<p>' + sessions.length + ' séries · ' + total + ' réponses · ' + (total ? Math.round(score / total * 100) : 0) + ' % de réussite</p>';
  const weak = rows.filter(o => o.r <= 0.5).sort((a, b) => a.r - b.r);
  const known = rows.filter(o => o.seen >= 2 && o.r >= 0.8).sort((a, b) => b.r - a.r);
  const li = arr => arr.length
    ? '<ul>' + arr.map(o => '<li>' + esc(label(o.it)) + ' <span class="muted">' + o.ok + '/' + o.seen + '</span></li>').join('') + '</ul>'
    : '<p class="muted">Pas encore assez de données.</p>';
  document.getElementById('weak').innerHTML = li(weak);
  document.getElementById('known').innerHTML = li(known);
  const h = sessions.slice().reverse().map(s =>
    '<tr><td>' + esc(new Date(s.date).toLocaleString('fr-CH')) + '</td><td>' + esc(s.mode) + '</td><td>' + s.score + ' / ' + s.total + '</td></tr>').join('');
  document.getElementById('history').innerHTML = sessions.length
    ? '<table><tr><th>Date</th><th>Mode</th><th>Score</th></tr>' + h + '</table>'
    : '<p class="muted">Aucune série.</p>';
}

function setMsg(t){ document.getElementById('syncMsg').textContent = t; }
function fillCfg(){
  document.getElementById('cfgUrl').value = cfg.url || '';
  document.getElementById('cfgKey').value = cfg.key || '';
}
function saveCfg(){
  cfg = {url: document.getElementById('cfgUrl').value.trim(), key: document.getElementById('cfgKey').value.trim()};
  localStorage.setItem(CFG, JSON.stringify(cfg));
  setMsg('Réglages enregistrés.');
}

function mergeSessions(arr){
  const map = {};
  [...sessions, ...arr].forEach(s => map[s.id] = s);
  sessions = Object.values(map).sort((a, b) => a.date < b.date ? -1 : 1);
  save(); renderBilan();
}

async function sync(){
  if (!cfg.url) { setMsg("Renseigne d'abord l'adresse du script dans les réglages."); return; }
  setMsg('Synchronisation…');
  try {
    const r = await fetch(cfg.url, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key: cfg.key || '', sessions})
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    mergeSessions(j.sessions);
    setMsg('Synchronisé : ' + sessions.length + ' séries.');
  } catch (e) {
    setMsg('Erreur : ' + e.message);
  }
}

function exportJson(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(sessions, null, 2)], {type: 'application/json'}));
  a.download = 'progression_allemand.json';
  a.click();
}
function importJson(ev){
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { mergeSessions(JSON.parse(r.result)); setMsg('Import OK.'); }
    catch (e) { setMsg('Fichier invalide.'); }
  };
  r.readAsText(f);
}
function resetAll(){
  if (confirm("Effacer tout l'historique sur cet appareil ?")) { sessions = []; save(); renderBilan(); }
}

function speakCur(){
  if (!('speechSynthesis' in window)) return;
  const it = items[idx];
  const backVisible = !document.getElementById('back').hidden;
  const t = it.kind === 'vocab' ? it.de : (backVisible ? it.form : it.lemma);
  const u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE';
  speechSynthesis.speak(u);
}

document.addEventListener('keydown', e => {
  if (document.getElementById('quiz').hidden) return;
  const v = !document.getElementById('actV').hidden;
  if (e.code === 'Space' && !v) { e.preventDefault(); reveal(); }
  else if (v && (e.key === 'y' || e.key === 'ArrowRight')) answer(true);
  else if (v && (e.key === 'n' || e.key === 'ArrowLeft')) answer(false);
});

show('home');
</script>
