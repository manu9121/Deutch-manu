<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entraînement allemand</title>
<style>
:root{--teal:#4aadb0;--bg:#eee;--red:#d91e18;--green:#6aa51d;--txt:#333;--muted:#777}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--txt)}
header{background:var(--teal);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav button{background:rgba(255,255,255,.15);border:1px solid #fff;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;margin-left:6px}
nav button.active{background:#fff;color:var(--teal)}
main{max-width:680px;margin:0 auto;padding:16px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:12px}
.bar{height:8px;background:#d5ecec;border-radius:4px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--teal);transition:width .3s}
.card{background:var(--bg);border-radius:8px;min-height:460px;display:flex;flex-direction:column;align-items:center;padding:28px 20px}
.card.home,.card.summary,.card.bilan{min-height:0;align-items:stretch}
.word{font-size:28px;margin-top:24px;text-align:center}
.sub{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.line{width:120px;border-top:1px solid #666;margin:16px auto}
.answer{font-size:26px;text-align:center;margin-top:8px}
.extra{font-size:15px;color:#555;text-align:center;margin-top:12px;max-width:520px}
.spk{background:none;border:none;font-size:20px;cursor:pointer;color:#555;margin-left:6px}
.hint2{font-size:13px;font-weight:bold;color:#444;margin-top:auto;padding-top:24px}
.actions{text-align:center;width:100%;padding-top:14px}
.btn{border:none;border-radius:50%;width:64px;height:64px;font-size:26px;color:#fff;cursor:pointer;margin:0 24px}
.btn.reveal{background:var(--teal)}
.btn.no{background:var(--red)}
.btn.yes{background:var(--green)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.primary{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:12px 18px;font-size:16px;cursor:pointer}
button{font:inherit}
.modes{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
.mode{background:#fff;border:1px solid #ccc;border-radius:6px;padding:10px 12px;cursor:pointer}
.muted{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols ul,.card ul{padding-left:18px;margin:6px 0 16px}
.cols li,.card li{font-size:14px;margin:3px 0}
h2{margin:0 0 8px;font-size:22px}
h3{font-size:15px;margin:14px 0 4px}
.actions2{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.actions2 button,.filebtn{background:#fff;border:1px solid #bbb;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:14px}
.filebtn{display:inline-block}
.danger{color:var(--red);border-color:var(--red)!important}
@media (max-width:560px){.cols{grid-template-columns:1fr}.word{font-size:24px}}
</style>
</head>
<body>
<header>
  <h1>Entraînement allemand</h1>

  </nav>
</header>

const KEY = 'deutsch_trainer_v1';
const N = 25;
let store = loadStore();
let view = 'home';
let mode = 'vocab';

function loadStore(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.stats && s.history) return s; } catch (e) {}
  return { stats: {}, history: [] };
}
function saveStore(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ALL = [
  ...D.vocab.map(x => ({...x, type: 'vocab'})),
  ...D.verbs.map(x => ({...x, type: 'verb'}))
];
const BYID = {};
ALL.forEach(x => BYID[x.id] = x);

function label(it){
  if (it.type === 'vocab') return it.de + ' = ' + it.fr;
  return it.lemma + ' · ' + it.pron + ' · ' + it.tenseFr + ' : ' + it.form;
}
function stat(id){ return store.stats[id] || {seen: 0, ok: 0}; }
function rate(id){ const s = stat(id); return s.seen ? s.ok / s.seen : null; }
// Mots souvent oubliés = poids plus élevé ; mots jamais vus = poids moyen
function weight(it){ const r = rate(it.id); return r === null ? 2 : 1 + 4 * (1 - r); }

function pickWeighted(pool, n){
  const arr = pool.slice(), out = [];
  while (out.length < n && arr.length){
    const total = arr.reduce((t, it) => t + weight(it), 0);
    let x = Math.random() * total, k = 0;
    for (; k < arr.length - 1; k++){ x -= weight(arr[k]); if (x < 0) break; }
    out.push(arr.splice(k, 1)[0]);
  }
  return out;
}
function buildSession(){
  const V = ALL.filter(x => x.type === 'vocab'), C = ALL.filter(x => x.type === 'verb');
  let items;
  if (mode === 'vocab') items = pickWeighted(V, N);
  else if (mode === 'verb') items = pickWeighted(C, N);
  else {
    const a = Math.ceil(N / 2);
    items = pickWeighted(V, a).concat(pickWeighted(C, N - a));
    items.sort(() => Math.random() - 0.5);
  }
  return { items, i: 0, results: [], revealed: false, mode };
}

function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  if (view === 'home') app.innerHTML = homeHTML();
  else if (view === 'session') app.innerHTML = sessionHTML();
  else if (view === 'summary') app.innerHTML = summaryHTML();
  else if (view === 'bilan') app.innerHTML = bilanHTML();
}

  return `<label class="mode"><input type="radio" name="mode" value="${v}" ${mode === v ? 'checked' : ''}> ${esc(t)}</label>`;
}

    ? `<div class="actions"><button class="btn no" data-act="answer" data-ok="0" title="Pas connu (←)">✖</button><button class="btn yes" data-act="answer" data-ok="1" title="Connu (→)">✔</button>
       <div class="hint">Connaissais-tu ${what} ?</div></div>`
    : `<div class="actions"><button class="btn reveal" data-act="reveal" title="Révéler (Espace)">⟳</button>
       <div class="hint">Révéler la réponse</div></div>`;
  return `<div class="prog"><div class="bar"><div style="width:${pct}%"></div></div><span>${S.i + 1} / ${n}</span></div>
    <div class="card">${front}${S.revealed ? '<div class="line"></div>' + back : ''}
      <div style="margin-top:auto;width:100%">${actions}</div>
    </div>`;
}

function summaryHTML(){
  const r = S.results, ok = r.filter(x => x.ok), ko = r.filter(x => !x.ok);
  const pct = r.length ? Math.round(ok.length / r.length * 100) : 0;
  return `<div class="card summary">
    <h2>Score : ${ok.length} / ${r.length} (${pct} %)</h2>
    <div class="cols">
      <div><h3>Connus (${ok.length})</h3><ul>${ok.map(x => `<li>${esc(x.label)}</li>`).join('')}</ul></div>
      <div><h3>Oubliés (${ko.length})</h3><ul>${ko.map(x => `<li>${esc(x.label)}</li>`).join('')}</ul></div>
    </div>
    <div class="actions2"><button class="primary" data-act="start">Nouvelle série</button><button data-act="nav-bilan">Voir le bilan</button></div>
  </div>`;
}

function bilanHTML(){
  const h = store.history;
  const seenIds = Object.keys(store.stats).filter(id => stat(id).seen > 0 && BYID[id]);
  const weak = seenIds.filter(id => rate(id) <= 0.5)
    .sort((a, b) => rate(a) - rate(b) || stat(b).seen - stat(a).seen);
  const strong = seenIds.filter(id => stat(id).seen >= 2 && rate(id) >= 0.8)
    .sort((a, b) => rate(b) - rate(a));
  const li = ids => ids.length
    ? ids.slice(0, 40).map(id => `<li>${esc(label(BYID[id]))} <span class="muted">${stat(id).ok}/${stat(id).seen}</span></li>`).join('')
    : '<li class="muted">Aucun pour l’instant</li>';
  const modeName = { vocab: 'vocabulaire', verb: 'conjugaison', both: 'mélangé' };
  const hist = h.slice(0, 30).map(s =>
    `<li>${new Date(s.date).toLocaleString('fr-CH')} — ${s.score}/${s.total} (${modeName[s.mode] || s.mode})</li>`).join('')
    || '<li class="muted">Aucune série</li>';
  const avg = h.length ? Math.round(h.reduce((t, s) => t + s.score / s.total, 0) / h.length * 100) : null;
  return `<div class="card bilan">
    <h2>Bilan</h2>
    <p>${h.length} série(s)${avg !== null ? ' · moyenne ' + avg + ' %' : ''} · ${seenIds.length} entrée(s) travaillées sur ${ALL.length}</p>
    <h3>À revoir (≤ 50 %)</h3><ul>${li(weak)}</ul>
    <h3>Bien maîtrisés (≥ 80 %, au moins 2 essais)</h3><ul>${li(strong)}</ul>
    <h3>Historique des séries</h3><ul>${hist}</ul>
    <div class="actions2">
      <button data-act="export">Exporter (JSON)</button>
      <label class="filebtn">Importer<input type="file" id="import" accept="application/json" hidden></label>
      <button class="danger" data-act="reset">Réinitialiser</button>
    </div>
  </div>`;
}

function answer(ok){
  const it = S.items[S.i];
  S.results.push({id: it.id, ok, label: label(it)});
  S.revealed = false;
  S.i++;
  if (S.i >= S.items.length) finish();
  render();
}
function finish(){
  const ok = S.results.filter(r => r.ok).length;
  S.results.forEach(r => {
    const s = store.stats[r.id] || {seen: 0, ok: 0};
    s.seen++; if (r.ok) s.ok++;
    store.stats[r.id] = s;
  });
  store.history.unshift({date: new Date().toISOString(), score: ok, total: S.results.length, mode: S.mode,
    results: S.results.map(r => ({id: r.id, ok: r.ok}))});
  saveStore();
  view = 'summary';
}
function startSession(){ S = buildSession(); view = 'session'; render(); }
function speak(t){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE'; speechSynthesis.speak(u);
}
function exportData(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'progression_allemand.json'; a.click();
}
function importFile(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s.stats || !s.history) throw new Error('format');
      store = s; saveStore(); render(); alert('Import réussi.');
    } catch (e) { alert('Fichier invalide.'); }
  };
  r.readAsText(f);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'nav-home' || act === 'nav-bilan'){
    if (view === 'session' && !confirm('Quitter la série en cours ? Elle ne sera pas enregistrée.')) return;
    view = act === 'nav-home' ? 'home' : 'bilan'; render(); return;
  }
  if (act === 'start') return startSession();
  if (act === 'reveal'){ S.revealed = true; return render(); }
  if (act === 'answer') return answer(b.dataset.ok === '1');
  if (act === 'speak') return speak(b.dataset.text);
  if (act === 'export') return exportData();
  if (act === 'reset' && confirm('Effacer toute la progression et l’historique ?')){
    store = {stats: {}, history: []}; saveStore(); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'mode') mode = e.target.value;
  if (e.target.id === 'import') importFile(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (view !== 'session' || !S || e.target.tagName === 'INPUT') return;
  if (!S.revealed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); S.revealed = true; render(); }
  else if (S.revealed && (e.key === 'ArrowRight' || e.key === 'y')) answer(true);
  else if (S.revealed && (e.key === 'ArrowLeft' || e.key === 'n')) answer(false);
});

render();
</script>
</body>
</html>
